<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyShop</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Our CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- ================= NAVBAR (same on every page) ================= -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('home') }}" class="logo">EasyShop</a>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('shop') }}">Shop</a></li>
                <li><a href="{{ url_for('admin') }}">Admin</a></li>
                <li>
                    <a href="{{ url_for('checkout') }}" class="cart-link">
                        Cart <span id="cart-count" class="cart-count">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- ================= PAGE CONTENT ================= -->
    {% block content %}{% endblock %}

    <!-- ================= FOOTER ================= -->
    <footer class="footer">
        <p>EasyShop - A simple e-commerce project built with Flask &amp; SQLite</p>
    </footer>

    <!-- Our JavaScript for the cart -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
